<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>17 образов — Лёгкие на подъём</title><style>body{margin:0;padding:32px;font:16px system-ui;background:#eef8ff;color:#273052}h1{text-align:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;max-width:1100px;margin:auto}.card{background:#fff;border-radius:20px;padding:14px;text-align:center;box-shadow:0 8px 24px #5673a122}.card svg{width:110px;height:158px;display:block;margin:auto}.card b{display:block}.card small{color:#71809c}</style></head><body><h1>Витрина скинов</h1><p style="text-align:center">Каталог рендерится тем же SVG-компонентом в игре.</p><div id="app" class="grid"></div><script type="module">const colors=[['Ягодка','#f45d7a','#862d54'],['Солнышко','#ffc342','#d86b2d'],['Океан','#42c7d0','#176b91'],['Лаванда','#a88be8','#59408d'],['Мята','#75d5ae','#267b6c'],['Закат','#fa8561','#9b3d51'],['Космос','#6863d8','#29245e'],['Ночь','#30426e','#17243f'],['Полоски','#f58b8d','#8b3859'],['Горошек','#7ac7e8','#28658c'],['Облака','#a5c9f5','#4771a7'],['Звёздочки','#7064d8','#29235f'],['Волны','#54c7b8','#1c6871'],['Радуга','#f39a75','#754b88'],['Сияние','#f7c8ff','#924eb0'],['Искры','#ffe28a','#b27620'],['Переливание','#9ee7e1','#3d63a7']];document.querySelector('#app').innerHTML=colors.map(([n,c,a])=>`<article class=card><svg viewBox="0 0 126 181"><defs><linearGradient id="g${n}" x2="1" y2="1"><stop stop-color="${c}" stop-opacity=".7"/><stop offset=".6" stop-color="${c}"/><stop offset="1" stop-color="${a}"/></linearGradient></defs><path d="M63 5C29 5 8 25 8 62c0 30 19 58 45 70l10 6 10-6c26-12 45-40 45-70C118 25 97 5 63 5Z" fill="url(#g${n})"/><ellipse cx=40 cy=35 rx=14 ry=24 fill="#fff" opacity=.3/><circle cx=43 cy=68 r=4 fill="${a}"/><circle cx=83 cy=68 r=4 fill="${a}"/><path d="M52 83q11 11 22 0" fill="none" stroke="${a}" stroke-width=3/><path d="M53 135l10 11 10-11-10 5z" fill="${a}"/></svg><b>${n}</b><small>SVG</small></article>`).join('');</script></body></html>
